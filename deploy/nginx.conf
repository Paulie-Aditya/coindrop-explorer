# /etc/nginx/sites-available/coindrop-explorer
# ln -s /etc/nginx/sites-available/coindrop-explorer /etc/nginx/sites-enabled/
# certbot --nginx -d explorer.coindrop.cc

server {
    listen 80;
    server_name explorer.coindrop.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name explorer.coindrop.cc;

    ssl_certificate     /etc/letsencrypt/live/explorer.coindrop.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.coindrop.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
