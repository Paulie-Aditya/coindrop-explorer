# /etc/nginx/sites-available/coindrop-explorer
#
# Ships HTTP-only on purpose: `sudo certbot --nginx -d explorer.coindrop.cc`
# then adds the 443 server block, certificate paths and the HTTP->HTTPS
# redirect itself. (A config that references the certificate before it exists
# fails `nginx -t`, which is what deploy.sh runs.)
#
# Port 8002: 8000 is api.coindrop.cc and 8001 is coindrop-backend on this box.

server {
    listen 80;
    server_name explorer.coindrop.cc;

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
